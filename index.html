<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>단어 학습실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --green:#4FE968;--green-deep:#2fb84c;--green-soft:#e6fbec;--green-ring:rgba(79,233,104,.35);
  --bg:#f5f7f5;--surface:#ffffff;--surface-2:#f1f4f1;--fg:#15241a;--muted:#5d6b61;--faint:#8a988d;
  --line:#e2e8e3;--danger:#e4572e;--danger-soft:#fcebe6;
  --radius:18px;--shadow:0 1px 2px rgba(20,36,26,.04), 0 10px 30px rgba(20,36,26,.06);
  --font:'Inter','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#4FE968;--green-deep:#6cf083;--green-soft:#17301d;--green-ring:rgba(79,233,104,.3);
    --bg:#0e140f;--surface:#161d18;--surface-2:#1d2620;--fg:#e8f0ea;--muted:#9db0a2;--faint:#6f7f74;
    --line:#2a352d;--danger:#ff7a58;--danger-soft:#3a201a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --green:#4FE968;--green-deep:#6cf083;--green-soft:#17301d;--green-ring:rgba(79,233,104,.3);
  --bg:#0e140f;--surface:#161d18;--surface-2:#1d2620;--fg:#e8f0ea;--muted:#9db0a2;--faint:#6f7f74;
  --line:#2a352d;--danger:#ff7a58;--danger-soft:#3a201a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:28px 64px;}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;cursor:pointer}
.logo{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;flex:none;box-shadow:0 4px 12px var(--green-ring)}
.logo svg{width:20px;height:20px}
.topbar .right{display:flex;gap:9px;align-items:center}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);height:38px;padding:0 13px;border-radius:11px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;transition:.15s}
.acct:hover{border-color:var(--faint)}
.adot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.adot.on{background:var(--green);box-shadow:0 0 0 3px var(--green-ring)}
.aname{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:38px;height:38px;border-radius:11px;cursor:pointer;display:grid;place-items:center;transition:.15s;flex:none}
.theme-btn:hover{color:var(--fg);border-color:var(--faint)}
.theme-btn svg{width:18px;height:18px}
.steps{display:flex;align-items:center;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--faint)}
.step .dot{width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;border:1px solid var(--line)}
.step.active{color:var(--fg)}
.step.active .dot{background:var(--green);color:#0e2414;border-color:var(--green)}
.step.done{color:var(--muted)}
.step.done .dot{background:var(--green-soft);color:var(--green-deep);border-color:transparent}
.step .bar{width:18px;height:2px;background:var(--line);border-radius:2px}
.steps.hide{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px}
.card + .card{margin-top:16px}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:11.5px;font-weight:700;color:var(--green-deep);margin-bottom:12px}
.lede{color:var(--muted);margin-top:10px;font-size:15px;max-width:52ch}
h1.hero{font-size:34px;font-weight:800;line-height:1.1}
h2.title{font-size:23px;font-weight:700}
.btn{appearance:none;border:none;border-radius:13px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;padding:14px 22px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn.primary{background:var(--green);color:#0e2414;box-shadow:0 6px 18px var(--green-ring)}
.btn.primary:hover{background:var(--green-deep);transform:translateY(-1px)}
.btn.primary:active{transform:translateY(0)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:10px 16px;font-size:13.5px;border-radius:11px}
.btn svg{width:18px;height:18px}
.actions{display:flex;gap:11px;margin-top:26px;flex-wrap:wrap}
.auth-tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:13px;margin-bottom:22px}
.auth-tabs button{flex:1;border:none;background:none;font-family:inherit;font-weight:700;font-size:14px;padding:11px;border-radius:9px;cursor:pointer;color:var(--muted);transition:.15s}
.auth-tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.inp{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.inp label{font-size:13px;font-weight:600;color:var(--muted)}
.inp input{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:13px 15px;font-size:15px;font-family:inherit}
.inp input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-ring)}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:18px;margin:2px 0 6px}
.link-row{display:flex;justify-content:center;margin-top:18px}
.link-btn{background:none;border:none;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--fg)}
.field{margin-top:26px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tier-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:13px;padding:14px 10px;cursor:pointer;font-family:inherit;text-align:center;transition:.12s;display:flex;flex-direction:column;gap:3px}
.tier-btn:hover{border-color:var(--green);background:var(--green-soft)}
.tier-btn.on{border-color:var(--green);background:var(--green-soft)}
.tier-btn b{font-size:14px;font-weight:700}
.tier-btn span{font-size:11px;color:var(--faint)}
.stepper{display:flex;align-items:center;gap:16px}
.stepper button{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:22px;font-weight:700;cursor:pointer;transition:.15s}
.stepper button:hover{background:var(--green-soft);border-color:var(--green)}
.count-val{font-size:40px;font-weight:800;min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.count-unit{color:var(--faint);font-size:13px;margin-top:2px;text-align:center}
input[type=range]{width:100%;margin-top:18px;accent-color:var(--green)}
.rng-scale{display:flex;justify-content:space-between;color:var(--faint);font-size:12px;margin-top:4px}
.qmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;color:var(--faint);font-size:13px;font-weight:600}
.pbar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:14px 0 26px}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s ease}
.prompt-word{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.prompt-sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.opts{display:grid;gap:11px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:16px 18px;font-size:16px;font-weight:500;font-family:inherit;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:13px}
.opt:hover{border-color:var(--green);background:var(--green-soft)}
.opt .key{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .key{background:var(--green);color:#0e2414}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.wrong .key{background:var(--danger);color:#fff}
.opt.disabled{pointer-events:none}
.opt.dim{opacity:.5}
.study-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--green-soft);color:var(--green-deep);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:99px}
.wordlist{display:grid;gap:10px;margin-top:22px}
.wordrow{display:flex;align-items:center;gap:14px;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.wordrow .idx{color:var(--faint);font-size:13px;font-weight:700;width:28px;flex:none;font-variant-numeric:tabular-nums}
.wordrow .wcell{min-width:0;display:flex;flex-direction:column;gap:2px}
.wordrow .en{font-size:18px;font-weight:700;min-width:0}
.wordrow .ko{margin-left:auto;color:var(--muted);font-size:15px;text-align:right;flex:none}
.ipa{font-size:12.5px;color:var(--faint);font-weight:500}
.pos{font-size:11px;font-weight:700;color:var(--green-deep);background:var(--green-soft);padding:2px 8px;border-radius:7px;flex:none;white-space:nowrap}
.prompt-ipa{color:var(--faint);font-size:15px;margin:-2px 0 4px}
.prompt-pos{display:inline-block;font-size:12px;font-weight:700;color:var(--green-deep);background:var(--green-soft);padding:3px 10px;border-radius:8px;margin-bottom:18px}
.tier-btn .count{font-size:11px;color:var(--faint);font-weight:600}
.tier-btn .pg{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:7px;width:100%}
.tier-btn .pg i{display:block;height:100%;background:var(--green);border-radius:99px}
.tier-btn .pgt{font-size:10px;color:var(--green-deep);font-weight:700;margin-top:4px}
.prog-card{background:var(--surface-2);border-radius:14px;padding:16px 18px;margin-top:16px}
.prog-card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.prog-card .top b{font-size:15px}
.prog-card .top span{font-size:13px;color:var(--green-deep);font-weight:700}
.prog-card .remain{font-size:12.5px;color:var(--muted);margin-top:8px}
.menu-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:24px}
.menu-card{display:flex;align-items:center;gap:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:16px;padding:18px 20px;cursor:pointer;font-family:inherit;text-align:left;transition:.14s;width:100%}
.menu-card:hover{border-color:var(--green);background:var(--green-soft);transform:translateY(-1px)}
.menu-card .mi{width:46px;height:46px;border-radius:13px;background:var(--green-soft);display:grid;place-items:center;flex:none}
.menu-card .mi svg{width:23px;height:23px;stroke:var(--green-deep)}
.menu-card.lead .mi{background:var(--green)} .menu-card.lead .mi svg{stroke:#0e2414}
.menu-card .mt{min-width:0;flex:1}
.menu-card .mt b{display:block;font-size:16px;font-weight:700}
.menu-card .mt span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.menu-card .mx{color:var(--faint);flex:none}
.menu-card .mx svg{width:18px;height:18px}
.active-banner{display:flex;align-items:center;gap:14px;background:var(--green-soft);border-radius:15px;padding:16px 18px;margin-top:20px}
.active-banner .ab-l{min-width:0;flex:1}
.active-banner .ab-l .lab{font-size:12px;font-weight:700;color:var(--green-deep);text-transform:uppercase;letter-spacing:.06em}
.active-banner .ab-l .lv{font-size:19px;font-weight:800;margin-top:3px}
.active-banner .ab-l .sm{font-size:12.5px;color:var(--muted);margin-top:3px}
.reset-row{display:flex;justify-content:center;margin-top:14px}
/* per-POS senses */
.senses{display:flex;flex-direction:column;gap:3px;margin-left:auto;text-align:right;align-items:flex-end;flex:none;max-width:60%}
.sense{display:flex;align-items:baseline;gap:7px;justify-content:flex-end;color:var(--fg);font-size:14.5px;line-height:1.35}
.sense>span{word-break:keep-all}
.plab{font-size:11px;font-weight:800;color:var(--green-deep);background:var(--green-soft);border-radius:6px;padding:1px 6px;flex:none}
.enline{display:flex;align-items:center;gap:6px;min-width:0}
.say{appearance:none;border:none;background:var(--surface-2);color:var(--muted);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none;transition:.12s;padding:0}
.say:hover{background:var(--green-soft);color:var(--green-deep)}
.say svg{width:15px;height:15px}
.say.inl{width:34px;height:34px;vertical-align:middle;background:var(--green-soft);color:var(--green-deep)}
.say.inl svg{width:19px;height:19px}
/* stage bar */
.stage-bar{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.sdot{font-size:12px;font-weight:700;color:var(--faint);background:var(--surface-2);border-radius:99px;padding:5px 12px}
.sdot.on{background:var(--green);color:#0e2414}
.sdot.done{background:var(--green-soft);color:var(--green-deep)}
.sarrow{color:var(--faint);font-size:12px}
/* listening */
.listen-big{display:flex;justify-content:center;margin:10px 0 22px}
.speak-btn{font-size:16px;padding:16px 26px}
.speak-btn svg{width:22px;height:22px}
/* spelling */
.spell-meaning{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 18px}
.spell-meaning .senses{margin:0 auto;text-align:center;align-items:center;max-width:100%}
.spell-meaning .sense{justify-content:center;font-size:22px;font-weight:700}
.spell-meaning .plab{font-size:13px}
.spell-input{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:16px 18px;font-size:22px;font-family:inherit;text-align:center;letter-spacing:.02em}
.spell-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--green-ring)}
.spell-fb{min-height:24px;text-align:center;font-size:15px;margin:12px 0;font-weight:600}
.spell-fb.ok{color:var(--green-deep)}
.spell-fb.no{color:var(--danger)}
.spell-fb .ans{font-size:18px}
.usage-mean{margin:4px 0 20px}
.usage-mean .senses{margin:0;text-align:left;align-items:flex-start;max-width:100%}
.usage-mean .sense{justify-content:flex-start;font-size:14px;color:var(--muted)}
.uopt .usen{font-size:16px;font-weight:500;line-height:1.4}
.uopt .usen b{font-weight:800;color:var(--green-deep)}
.uopt.wrong .usen b{color:var(--danger)}
.stat-row.four{grid-template-columns:repeat(4,1fr)}
@media(max-width:560px){.stat-row.four{grid-template-columns:repeat(2,1fr)}}
.miss-tags{display:inline-flex;gap:5px;margin-top:3px}
.miss-tags .mt{font-size:10px;font-weight:700;color:var(--danger);background:var(--danger-soft);border-radius:5px;padding:1px 6px}
/* duolingo-style roadmap */
.road{position:relative;margin:24px 0 8px;padding:4px 0}
.road-row{display:flex;align-items:center;gap:16px;position:relative;padding:7px 0}
.road-row .rnode{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;border:3px solid var(--line);background:var(--surface);color:var(--faint);position:relative;z-index:2}
.road-row.done .rnode{background:var(--green);border-color:var(--green);color:#0e2414;box-shadow:0 4px 12px var(--green-ring)}
.road-row.cur .rnode{background:var(--surface);border-color:var(--green);color:var(--green-deep);box-shadow:0 0 0 5px var(--green-ring);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--green-ring)}50%{box-shadow:0 0 0 8px transparent}}
.road-row .rnode .chk{width:22px;height:22px}
.road-line{position:absolute;left:25px;top:26px;bottom:26px;width:3px;background:var(--line);z-index:1}
.road-line i{position:absolute;bottom:0;left:0;width:100%;background:var(--green);border-radius:3px;transition:height .5s}
.road-info{min-width:0;flex:1}
.road-info b{font-size:16px;font-weight:700;display:block}
.road-info.curb b{color:var(--green-deep)}
.road-info span{font-size:12.5px;color:var(--muted)}
.road-row.cur .road-info .mini{margin-top:6px;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.road-row.cur .road-info .mini i{display:block;height:100%;background:var(--green);border-radius:99px}
.road-badge{margin-left:auto;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;flex:none}
.road-badge.done{color:var(--green-deep);background:var(--green-soft)}
.road-badge.cur{color:#0e2414;background:var(--green)}
.road-badge.lock{color:var(--faint);background:var(--surface-2)}
.level-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--green-soft),var(--surface-2));border-radius:16px;padding:18px 20px;margin-top:4px}
.level-hero .lv-ring{width:64px;height:64px;position:relative;flex:none}
.level-hero .lv-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.level-hero .lv-txt{min-width:0}
.level-hero .lv-txt b{font-size:19px;font-weight:800;display:block}
.level-hero .lv-txt span{font-size:13px;color:var(--muted)}
.sect-h{font-size:15px;font-weight:700;margin:26px 0 4px;display:flex;align-items:center;gap:9px}
.sect-h .d{width:9px;height:9px;border-radius:50%}
.road-info .mini-t{font-size:12px;color:var(--green-deep);font-weight:700;margin-top:4px;display:block}
.score-ring{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.ring{position:relative;width:168px;height:168px;margin-bottom:8px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring .num span{color:var(--faint);font-size:13px;font-weight:600;margin-top:4px}
.verdict{font-size:19px;font-weight:700;margin-top:6px}
.verdict small{display:block;color:var(--muted);font-weight:500;font-size:14px;margin-top:6px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.stat-row.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--surface-2);border-radius:14px;padding:16px 18px}
.stat b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-top:2px}
.stat.ok b{color:var(--green-deep)}
.stat.no b{color:var(--danger)}
.analysis h3{font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.analysis h3 .d{width:9px;height:9px;border-radius:50%}
.d.g{background:var(--green)} .d.r{background:var(--danger)}
.res-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:12px;background:var(--surface-2);margin-bottom:8px}
.res-row .en{font-weight:700;font-size:16px}
.res-row .ko{color:var(--muted);font-size:14px;margin-left:auto;text-align:right}
.res-row .picked{color:var(--danger);font-size:12.5px;display:block;margin-top:2px}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.mark svg{width:13px;height:13px}
.mark.g{background:var(--green)} .mark.r{background:var(--danger)}
.mark.g svg{stroke:#0e2414} .mark.r svg{stroke:#fff}
.empty-note{color:var(--faint);font-size:14px;padding:4px 2px}
.saved-tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--green-deep);margin-top:20px}
.saved-tag.muted{color:var(--muted)}
.saved-tag svg{width:16px;height:16px}
.wrow{display:flex;align-items:center;gap:13px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.wrow .en{font-weight:700;font-size:16px}
.wrow .ko{color:var(--muted);font-size:14px}
.wrow .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--danger);background:var(--danger-soft);padding:4px 10px;border-radius:99px;flex:none}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.hrow .date{font-size:13px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}
.hrow .lv{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:7px}
.hrow .pct{margin-left:auto;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.hrow .pct small{font-size:12px;color:var(--faint);font-weight:600}
.nick{display:flex;gap:10px;margin-top:14px}
.nick input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit}
.nick input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-ring)}
.hint{display:flex;gap:11px;align-items:flex-start;background:var(--green-soft);border-radius:13px;padding:14px 16px;margin-top:22px;font-size:13.5px;color:var(--fg)}
.hint.warn{background:var(--danger-soft)}
.hint svg{width:18px;height:18px;flex:none;margin-top:1px;stroke:var(--green-deep)}
.hint.warn svg{stroke:var(--danger)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

// 품사별 뜻을 줄 단위로 렌더 (암기·결과 화면)
function sensesHtml(w){ if(!w.senses||!w.senses.length) return `<span class="ko">${esc(w.ko)}</span>`;
  return `<span class="senses">`+w.senses.map(([p,k])=>`<span class="sense">${p?`<b class="plab">${esc(p)})</b>`:""}<span>${esc(k)}</span></span>`).join("")+`</span>`; }
function ipaHtml(w){ return w.ipa?`<span class="ipa">${esc(w.ipa)}</span>`:""; }
// 프롬프트용 품사 뱃지 (중복 제거한 라벨 모음)
function posBadge(w){ const labs=[...new Set((w.senses||[]).map(s=>s[0]).filter(Boolean))]; return labs.length?`<span class="prompt-pos">${esc(labs.join("·"))}</span>`:""; }
// mastery: distinct correctly-answered words per tier (logged-in users)
function masteryCounts(){
  const sets=Array.from({length:NT},()=>new Set());
  const a=acc(); if(a&&a.sessions) a.sessions.forEach(s=>(s.right||[]).forEach(w=>{ const ww=findEn(w.en); if(ww) sets[ww.tier].add(w.en); }));
  return sets.map(s=>s.size);
}
function tierPct(i,counts){ const c=(counts||masteryCounts())[i]; return Math.round(c/TIER_TOTAL(i)*100); }

const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (arr,n) => shuffle(arr).slice(0,n);
function distractors(word,n){
  const pool=shuffle(ALL.filter(w=>w.ko!==word.ko));
  const same=pool.filter(w=>w.tier===word.tier);
  const picks=[...same,...pool].filter((w,i,s)=>s.findIndex(x=>x.ko===w.ko)===i);
  const out=[],seen=new Set([word.ko]);
  for(const w of picks){ if(out.length>=n) break; if(!seen.has(w.ko)){seen.add(w.ko);out.push(w.ko);} }
  while(out.length<n) out.push("—");
  return out;
}
const KEYS=["A","B","C","D"];
function fmtDate(ts){ const d=new Date(ts),p=x=>String(x).padStart(2,"0"); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }

let state = { tier:null, count:DEFAULT_WORDS, assigned:[], test:[], answers:[], qIndex:0, diagnosis:null, used:{}, activeTier:null };

// ---- per-user progress: used words (안 겹치게) + active tier (이어서) ----
// logged-in → account에 저장, guest → state(메모리)
function getUsed(tier){
  if(auth.user){ const a=acc(); return (a&&a.used&&a.used[tier])?a.used[tier]:[]; }
  return state.used[tier]||[];
}
function addUsed(tier, ens){
  let arr;
  if(auth.user){ const a=acc(); if(!a) return; if(!a.used) a.used={}; arr=a.used[tier]||(a.used[tier]=[]); }
  else { arr=state.used[tier]||(state.used[tier]=[]); }
  const set=new Set(arr); ens.forEach(e=>set.add(e)); const merged=[...set];
  if(auth.user){ acc().used[tier]=merged; } else { state.used[tier]=merged; }
}
function resetTier(tier){
  if(auth.user){ const a=acc(); if(a&&a.used) a.used[tier]=[]; }
  else { state.used[tier]=[]; }
}
function usedCount(tier){ return getUsed(tier).length; }
function availForTier(tier){ const u=new Set(getUsed(tier)); return byTier(tier).filter(w=>!u.has(w.en)); }
function getActiveTier(){ const v=auth.user?(acc()?acc().activeTier:null):state.activeTier; return (v==null?null:v); }
function setActiveTier(t){ if(auth.user){ if(acc()) acc().activeTier=t; } else { state.activeTier=t; } }

// ---- auth + storage (cloud db, localStorage fallback, hashed pw) ----
const LS_DB="vocab_users_v1", LS_SESSION="vocab_session_v1";
let auth={ user:null, data:null, guest:false };
let cloud=null;
async function initCloud(){
  try{
    if(window.claude && typeof claude.use==="function"){
      const db=await Promise.race([ claude.use("db"), new Promise(r=>setTimeout(()=>r(null),6000)) ]);
      if(db) cloud=db;
    }
  }catch(e){ cloud=null; }
}
const isOnline=()=>!!cloud;
function loadLS(){ try{ return JSON.parse(localStorage.getItem(LS_DB))||{}; }catch(e){ return {}; } }
function saveLS(db){ try{ localStorage.setItem(LS_DB, JSON.stringify(db)); return true; }catch(e){ return false; } }
async function getAccount(u){
  if(cloud){
    try{
      const snap=await cloud.doc("accounts/"+u).get();
      if(snap){ if(snap.exists===false) return null; if(typeof snap.data==="function") return snap.data(); if(snap.data) return snap.data; }
      return null;
    }catch(e){ return null; }
  }
  const db=loadLS(); return db[u]||null;
}
async function putAccount(u,a){
  if(cloud){ try{ await cloud.doc("accounts/"+u).set(a); return true; }catch(e){ return false; } }
  const db=loadLS(); db[u]=a; return saveLS(db);
}
async function saveCurrent(){ if(!auth.user||!auth.data) return false; return await putAccount(auth.user, auth.data); }
function randSalt(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
async function hashPw(pw,salt){
  const msg=salt+"::"+pw;
  try{ const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(let i=0;i<msg.length;i++){ h=((h<<5)+h+msg.charCodeAt(i))>>>0; } return "f"+h.toString(16); }
}
function acc(){ return auth.user ? auth.data : null; }
function logout(){ auth.user=null; auth.data=null; auth.guest=false; state.used={}; state.activeTier=null; try{localStorage.removeItem(LS_SESSION);}catch(e){} renderAccountUI(); screenAuth(); }
function renderAccountUI(){
  const el=$("#acct"); if(!el) return;
  const dot=el.querySelector(".adot"), name=el.querySelector(".aname");
  if(auth.user){ const a=acc(); dot.className="adot on"; name.textContent=(a&&a.nickname)?a.nickname:auth.user; el.title="내 학습 기록 보기"; el.onclick=screenRecords; }
  else{ dot.className="adot"; name.textContent="로그인"; el.title="로그인 / 회원가입"; el.onclick=screenAuth; }
}
function setStep(active){
  const order=["level","setup","study","test","result"]; const ai=order.indexOf(active);
  $("#steps").classList.toggle("hide", ai<0);
  document.querySelectorAll(".step").forEach(el=>{ const i=order.indexOf(el.dataset.s); el.classList.toggle("active",i===ai&&ai>=0); el.classList.toggle("done",ai>=0&&i<ai); });
}

  const err=m=>{ $("#err").textContent=m; };
  $("#authForm").onsubmit=async(e)=>{
    e.preventDefault();
    const u=($("#uid").value||"").trim(), pw=$("#pw").value||"";
    if(!/^[\w가-힣]{3,16}$/.test(u)){ err("아이디는 3~16자의 영문·숫자·한글이어야 해요."); return; }
    if(pw.length<4){ err("비밀번호는 4자 이상이어야 해요."); return; }
    if(!isLogin){ const pw2=$("#pw2").value||""; if(pw!==pw2){ err("비밀번호가 서로 달라요."); return; } }
    const submit=$("#authForm button[type=submit]"); submit.disabled=true; const label=submit.textContent; submit.textContent="처리 중…"; err("");
    const fail=m=>{ err(m); submit.disabled=false; submit.textContent=label; };
    if(isLogin){
      const a=await getAccount(u); if(!a){ fail("존재하지 않는 아이디예요."); return; }

      auth.user=u; auth.data=a;
    }else{
      const exists=await getAccount(u); if(exists){ fail("이미 사용 중인 아이디예요."); return; }

      auth.user=u; auth.data=a;
    }
    try{ localStorage.setItem(LS_SESSION, u); }catch(e){}
    auth.guest=false; renderAccountUI(); state.tier=null; state.diagnosis=null; screenHome();
  };
  setTimeout(()=>{ const el=$("#uid"); if(el) el.focus(); },50);
}

    $("#pick").onclick=screenSetup;
    $("#back").onclick=screenHome;
    return;

  const total=TIER_TOTAL(at), used=usedCount(at), rem=total-used, p=Math.round(used/total*100);
  const counts=masteryCounts(), mastered=counts[at];
  const maxForTier=Math.min(MAX_WORDS, rem);
  if(state.count>maxForTier) state.count=Math.max(MIN_WORDS,maxForTier);
  if(state.count<MIN_WORDS) state.count=MIN_WORDS;
  const done = rem<=0;
  view.innerHTML=`
  <div class="card fade">
    <div class="study-head"><div><div class="eyebrow">단어암기</div><h2 class="title">이어서 공부해요</h2></div><span class="chip">${esc(TIER_META[at].name)}</span></div>

    <div class="prog-card">
      <div class="top"><b>학습한 단어</b><span>${used} / ${total}</span></div>
      <div class="pbar"><i style="width:${p}%"></i></div>
      <div class="remain">남은 새 단어 <b style="color:var(--green-deep)">${rem}개</b>${auth.user?` · 시험에서 맞힌 단어 ${mastered} / ${total}`:``}</div>
    </div>
    ${done?`<div class="hint warn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>이 단계의 단어를 모두 학습했어요! <b>처음부터 다시 시작하기</b>로 초기화하거나 단계를 바꿔 보세요.</span></div>`:`
    <div class="field" style="margin-top:22px">
      <label>한 번에 외울 단어 개수 <span style="color:var(--faint);font-weight:500">· 권장 ${DEFAULT_WORDS}개</span></label>

      <div class="rng-scale"><span>${MIN_WORDS}</span><span>${maxForTier}</span></div>
    </div>`}
    <div class="actions">
      <button class="btn primary${done?'':''}" id="go" ${done?'disabled':''}>이어서 공부하기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

    </div>
    <div class="reset-row"><button class="link-btn" id="reset">처음부터 다시 시작하기 (이 단계 초기화)</button></div>
    <div class="reset-row" style="margin-top:4px"><button class="link-btn" id="back" style="color:var(--faint)">← 메인으로</button></div>
  </div>`;

    const cv=$("#countVal"),rng=$("#rng");
    const sync=v=>{ v=Math.max(MIN_WORDS,Math.min(maxForTier,v)); state.count=v; cv.textContent=v; rng.value=v; };
    $("#minus").onclick=()=>sync(state.count-1); $("#plus").onclick=()=>sync(state.count+1); rng.oninput=()=>sync(+rng.value);
    $("#go").onclick=continueStudy;
  }
  $("#change").onclick=screenSetup;
  $("#back").onclick=screenHome;
  const rb=$("#reset"); let armed=false;
  rb.onclick=async()=>{
    if(!armed){ armed=true; rb.textContent="한 번 더 누르면 이 단계가 초기화돼요"; rb.style.color="var(--danger)"; setTimeout(()=>{armed=false; const e=$("#reset"); if(e){e.textContent="처음부터 다시 시작하기 (이 단계 초기화)"; e.style.color="";}},3000); return; }
    resetTier(at); if(auth.user) await saveCurrent(); screenStudyHub();
  };
}
function continueStudy(){
  const at=getActiveTier(); if(at==null){ screenStudyHub(); return; }
  const avail=availForTier(at);
  if(!avail.length){ screenStudyHub(); return; }
  state.tier=at;
  state.assigned=sample(avail, Math.min(state.count, avail.length));
  screenStudy();
}

const ICspk='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>';
let enVoice=null;

function speak(text,rate){ try{ if(typeof speechSynthesis==="undefined") return; const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate||0.92; if(enVoice)u.voice=enVoice; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

// ---- 4. Test (객관식 → 영작 → 듣기) ----
const STAGES=["mc","spell","listen","usage"];
const STAGE_META={
  mc:{n:"객관식",sub:"단어의 뜻을 고르세요"},
  spell:{n:"영어 쓰기",sub:"뜻을 보고 영어 철자를 쓰세요"},
  listen:{n:"듣기",sub:"들리는 단어의 뜻을 고르세요"},
  usage:{n:"예문",sub:"단어가 올바르게 쓰인 문장을 고르세요"}
};
// 품사별 예문 프레임 (W 자리에 단어 삽입). 정답=단어가 가진 품사 프레임, 오답=없는 품사 프레임.
const POSFRAMES={
  "명":["I like the W.","Look at the W.","The W is over there.","This is my W."],
  "동":["They W every day.","Let's W together.","I want to W now.","We W after lunch."],
  "형":["It is very W.","She looks W today.","That was a W day.","This one is too W."],
  "부":["He speaks W.","She did it W.","They finished W.","It worked W."]
};
function usableUsage(w){ return (w.senses||[]).some(s=>POSFRAMES[s[0]]); }
function fillFrame(fr,en){ return fr.replace("W",`<b>${esc(en)}</b>`); }
function buildUsage(w){
  const labels=(w.senses||[]).map(s=>s[0]);
  const primary=labels.find(l=>POSFRAMES[l]); if(!primary) return null;
  const correct=fillFrame(shuffle(POSFRAMES[primary])[0], w.en);
  const wrongCats=Object.keys(POSFRAMES).filter(c=>!labels.includes(c));
  let pool=[]; wrongCats.forEach(c=>POSFRAMES[c].forEach(f=>pool.push(f)));
  pool=shuffle(pool);
  const wrongs=[]; for(const f of pool){ const s=fillFrame(f,w.en); if(s!==correct&&!wrongs.includes(s)){wrongs.push(s);} if(wrongs.length>=2)break; }
  if(wrongs.length<2) return null;
  const opts=shuffle([{t:correct,ok:true},{t:wrongs[0],ok:false},{t:wrongs[1],ok:false}]);
  return {opts, primary};
}
let test={si:0,qi:0,order:{},ans:{}};
const normEn=s=>String(s||"").trim().toLowerCase().replace(/[^a-z]/g,"");
function startTest(){
  // 시험으로 넘어가면 이 단어들은 '쓴 단어'로 기록 → 초기화 전까지 다시 안 나옴
  const byT={}; state.assigned.forEach(w=>{ (byT[w.tier]=byT[w.tier]||[]).push(w.en); });
  Object.keys(byT).forEach(t=>addUsed(+t, byT[t]));
  if(auth.user) saveCurrent();
  test={ si:0, qi:0, order:{ mc:shuffle(state.assigned), spell:shuffle(state.assigned), listen:shuffle(state.assigned), usage:shuffle(state.assigned.filter(usableUsage)) }, ans:{ mc:[], spell:[], listen:[], usage:[] } };
  runStage();
}
function stageHeader(stage){
  const idx=STAGES.indexOf(stage), m=STAGE_META[stage], arr=test.order[stage];
  const dots=STAGES.map((s,i)=>`<span class="sdot ${i<idx?'done':''} ${i===idx?'on':''}">${STAGE_META[s].n}</span>`).join('<span class="sarrow">→</span>');
  return `<div class="stage-bar">${dots}</div>
    <div class="qmeta"><span>${m.n} · ${m.sub}</span><span>${test.qi+1} / ${arr.length}</span></div>
    <div class="pbar"><i style="width:${(test.qi/arr.length)*100}%"></i></div>`;
}
function runStage(){
  setStep("test");
  const stage=STAGES[test.si], arr=test.order[stage];
  if(test.qi>=arr.length){ test.si++; test.qi=0; if(test.si>=STAGES.length){ screenResult(); return; } return runStage(); }
  if(stage==="mc") renderMC();
  else if(stage==="spell") renderSpell();
  else if(stage==="listen") renderListen();
  else renderUsage();
}
function afterAnswer(){ test.qi++; runStage(); }
// 객관식 / 듣기 공통: 보기(한국어 뜻) 고르기
function renderChoice(stage){
  const w=test.order[stage][test.qi];
  const opts=shuffle([w.ko,...distractors(w,3)]);
  const isListen=stage==="listen";
  view.innerHTML=`
  <div class="card fade">
    ${stageHeader(stage)}
    ${isListen?`
      <p class="prompt-sub">단어를 듣고 뜻을 고르세요</p>
      <div class="listen-big"><button class="btn primary speak-btn" id="replay">${ICspk}<span>다시 듣기</span></button></div>
    `:`

    <div class="opts" id="opts"></div>

  else { const s=$("#say"); if(s)s.onclick=()=>speak(w.en); }
  const box=$("#opts");
  opts.forEach((o,k)=>{ const b=document.createElement("button"); b.className="opt"; b.innerHTML=`<span class="key">${KEYS[k]}</span><span>${esc(o)}</span>`; b.onclick=()=>pick(b,o); box.appendChild(b); });
  function pick(btn,chosen){
    const correct=chosen===w.ko; test.ans[stage].push({word:w,chosen,correct});
    box.querySelectorAll(".opt").forEach(el=>{ el.classList.add("disabled"); const label=el.querySelector("span:last-child").textContent; if(label===w.ko) el.classList.add("correct"); else if(el===btn) el.classList.add("wrong"); else el.classList.add("dim"); });
    if(isListen&&!correct) speak(w.en);
    setTimeout(afterAnswer, correct?560:1050);
  }
}
function renderMC(){ renderChoice("mc"); }
function renderListen(){ renderChoice("listen"); }
// 영작: 한국어 뜻 보고 영어 철자 입력
function renderSpell(){
  const w=test.order.spell[test.qi];
  view.innerHTML=`
  <div class="card fade">
    ${stageHeader("spell")}
    <p class="prompt-sub">이 뜻의 영어 단어를 쓰세요</p>
    <div class="spell-meaning">${sensesHtml(w)}</div>
    <form id="spf" autocomplete="off">
      <input id="spin" class="spell-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력…" inputmode="latin">
      <div class="spell-fb" id="spfb"></div>
      <button class="btn primary block" type="submit" id="spbtn">확인</button>
    </form>
    <div class="reset-row" style="margin-top:12px"><button class="link-btn" id="skip" style="color:var(--faint)">모르겠어요 (건너뛰기)</button></div>
  </div>`;
  const inp=$("#spin"); setTimeout(()=>inp&&inp.focus(),60);
  let done=false;
  function submit(val){
    if(done) return; done=true;

    const fb=$("#spfb"); inp.disabled=true; $("#spbtn").disabled=true;

    speak(w.en);
    setTimeout(afterAnswer, correct?620:1400);
  }
  $("#spf").onsubmit=e=>{ e.preventDefault(); submit(inp.value); };
  $("#skip").onclick=()=>submit("");
}
// 품사 예문 퀴즈: 단어가 올바르게 쓰인 문장 고르기
function renderUsage(){
  const w=test.order.usage[test.qi];
  const q=buildUsage(w);
  if(!q){ test.ans.usage.push({word:w,correct:true}); return afterAnswer(); } // 만들 수 없으면 통과 처리
  view.innerHTML=`
  <div class="card fade">
    ${stageHeader("usage")}
    <p class="prompt-sub">이 단어가 <b>자연스럽게 쓰인</b> 문장은?</p>
    <div class="prompt-word">${esc(w.en)} <button class="say inl" id="say" aria-label="발음">${ICspk}</button></div>
    <div class="usage-mean">${sensesHtml(w)}</div>
    <div class="opts uopts" id="opts"></div>
  </div>`;
  const s=$("#say"); if(s)s.onclick=()=>speak(w.en);
  const box=$("#opts");
  q.opts.forEach((o,k)=>{ const b=document.createElement("button"); b.className="opt uopt"; b.innerHTML=`<span class="key">${KEYS[k]}</span><span class="usen">${o.t}</span>`; b.onclick=()=>pick(b,o); box.appendChild(b); });
  function pick(btn,o){
    test.ans.usage.push({word:w,correct:o.ok});
    box.querySelectorAll(".opt").forEach(el=>el.classList.add("disabled"));
    q.opts.forEach((oo,k)=>{ const el=box.children[k]; if(oo.ok) el.classList.add("correct"); else if(el===btn) el.classList.add("wrong"); else el.classList.add("dim"); });
    setTimeout(afterAnswer, o.ok?640:1250);
  }
}

// ---- 5. Result (3단계 종합) ----
function screenResult(){
  setStep("result");
  const stageC={}, stageT={};
  STAGES.forEach(s=>{ const a=test.ans[s]||[]; stageT[s]=a.length; stageC[s]=a.filter(x=>x.correct).length; });
  const totalQ=STAGES.reduce((n,s)=>n+stageT[s],0), totalC=STAGES.reduce((n,s)=>n+stageC[s],0);
  const pct=totalQ?Math.round(totalC/totalQ*100):0;
  // 단어별 집계: 각 단어가 어느 단계에서 틀렸는지
  const byWord={};
  STAGES.forEach(s=>(test.ans[s]||[]).forEach(x=>{ const e=x.word.en; (byWord[e]=byWord[e]||{word:x.word,miss:[]}); if(!x.correct) byWord[e].miss.push(s); }));
  const words=Object.values(byWord);
  const perfect=words.filter(w=>!w.miss.length), review=words.filter(w=>w.miss.length);
  // 숙달(맞힌 단어) = 객관식 정답 단어
  const mcRight=(test.ans.mc||[]).filter(x=>x.correct).map(x=>x.word);
  const mcWrong=(test.ans.mc||[]).filter(x=>!x.correct).map(x=>x.word);
  let verdict,note;
  if(pct===100){verdict="완벽해요! 🎉";note="뜻·철자·듣기 모두 통과했어요.";}
  else if(pct>=80){verdict="아주 좋아요";note="거의 다 내 것이에요. 틀린 몇 개만 복습!";}
  else if(pct>=60){verdict="잘하고 있어요";note="절반 이상 맞혔어요. 약한 단계를 다시 봐요.";}
  else if(pct>=40){verdict="조금 더 힘내요";note="아직 낯선 단어가 많네요. 암기부터 다시.";}
  else {verdict="처음이 어렵죠";note="천천히 다시 외우면 금방 익숙해져요.";}
  const STLAB={mc:"객관식",spell:"영작",listen:"듣기",usage:"예문"};
  let savedLine="";
  if(auth.user){
    const a=acc()||{sessions:[]};
    a.sessions=(a.sessions||[]).concat([{ ts:Date.now(),tier:state.tier,total:state.assigned.length,correct:mcRight.length,pct,
      stages:{mc:[stageC.mc,stageT.mc],spell:[stageC.spell,stageT.spell],listen:[stageC.listen,stageT.listen],usage:[stageC.usage,stageT.usage]},
      wrong:mcWrong.map(x=>({en:x.en,ko:x.ko})), right:mcRight.map(x=>({en:x.en,ko:x.ko})) }]).slice(-120);
    auth.data=a;
    saveCurrent().then(ok=>{ const t=$("#saveLine"); if(!t) return; t.className="saved-tag"+(ok?"":" muted"); t.innerHTML = ok?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> ${esc(auth.user)} 계정에 저장했어요${isOnline()?' (온라인)':''}`:`저장에 실패했어요. 잠시 후 다시 시도해 주세요.`; });
    savedLine=`<div class="saved-tag muted" id="saveLine">저장 중…</div>`;
  }else{ savedLine=`<div class="saved-tag muted" id="saveLine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> 로그인하면 이 결과가 저장돼요</div>`; }
  const C=2*Math.PI*74,off=C*(1-pct/100);
  const resRow=(w,missTags)=>`<div class="res-row"><span class="mark ${missTags?'r':'g'}">${missTags?'<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'}</span><div class="wcell"><span class="enline"><span class="en">${esc(w.en)}</span><button class="say" data-w="${esc(w.en)}" aria-label="발음">${ICspk}</button></span>${ipaHtml(w)}${missTags||""}</div>${sensesHtml(w)}</div>`;
  const noRows=review.length?review.map(r=>resRow(r.word,`<span class="miss-tags">${r.miss.map(s=>`<span class="mt">${STLAB[s]}</span>`).join("")}</span>`)).join(""):`<p class="empty-note">모든 단계를 통과했어요. 훌륭해요!</p>`;
  const okRows=perfect.length?perfect.map(r=>resRow(r.word,"")).join(""):`<p class="empty-note">아직 전 단계를 통과한 단어가 없어요.</p>`;
  const stPct=s=>stageT[s]?Math.round(stageC[s]/stageT[s]*100):0;
  view.innerHTML=`
  <div class="card fade">
    <div class="eyebrow">결과 분석 · 4단계 종합</div>
    <div class="score-ring">
      <div class="ring"><svg width="168" height="168"><circle cx="84" cy="84" r="74" fill="none" stroke="var(--surface-2)" stroke-width="13"/><circle cx="84" cy="84" r="74" fill="none" stroke="var(--green)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="num"><b>${pct}<span style="font-size:20px">%</span></b><span>${totalC} / ${totalQ} 정답</span></div></div>
      <div class="verdict">${verdict}<small>${note}</small></div>
      ${savedLine}
    </div>
    <div class="stat-row four">
      <div class="stat"><b>${stPct("mc")}<span style="font-size:14px">%</span></b><span>객관식 ${stageC.mc}/${stageT.mc}</span></div>
      <div class="stat"><b>${stPct("spell")}<span style="font-size:14px">%</span></b><span>영작 ${stageC.spell}/${stageT.spell}</span></div>
      <div class="stat"><b>${stPct("listen")}<span style="font-size:14px">%</span></b><span>듣기 ${stageC.listen}/${stageT.listen}</span></div>
      <div class="stat"><b>${stPct("usage")}<span style="font-size:14px">%</span></b><span>예문 ${stageC.usage}/${stageT.usage}</span></div>
    </div>
    <div class="analysis"><h3><span class="d r"></span>다시 볼 단어 (${review.length})</h3>${noRows}<h3><span class="d g"></span>완벽히 맞힌 단어 (${perfect.length})</h3>${okRows}</div>
    <div class="actions">${review.length?`<button class="btn primary" id="retry">틀린 단어만 다시</button>`:""}<button class="btn ${review.length?'ghost':'primary'}" id="again">새 단어로 이어서</button></div>
    <div class="actions" style="margin-top:11px">${auth.user?`<button class="btn ghost" id="rec2">내 기록 보기</button>`:""}<button class="btn ghost" id="home">메인으로</button></div>
  </div>`;
  document.querySelectorAll(".say").forEach(b=>b.onclick=()=>speak(b.dataset.w));
  if(review.length){ $("#retry").onclick=()=>{ state.assigned=review.map(r=>r.word); state.count=state.assigned.length; screenStudy(); }; }
  $("#again").onclick=()=>{ const at=getActiveTier(); if(at!=null && availForTier(at).length) continueStudy(); else screenStudyHub(); };
  if(auth.user) $("#rec2").onclick=screenRecords;
  $("#home").onclick=screenHome;
}

// ---- 내 기록 ----
// 듀오링고식 레벨 로드맵 (총 9단계 / 현재위치 / 앞뒤 / 전체 %)
const CLEAR_PCT=80;
function roadmapHtml(){
  const counts=masteryCounts();
  const pcts=counts.map((c,i)=>Math.round(c/TIER_TOTAL(i)*100));
  let cur=getActiveTier();
  if(cur==null){ cur=pcts.findIndex(p=>p<CLEAR_PCT); if(cur<0)cur=NT-1; }
  const totalMastered=counts.reduce((s,c)=>s+c,0);
  const overall=Math.round(totalMastered/(NT*300)*100);
  const curPct=pcts[cur];
  const prevName=cur>0?TIER_META[cur-1].name:"—";
  const nextName=cur<NT-1?TIER_META[cur+1].name:"최고 단계";
  const oc=2*Math.PI*26, ooff=oc*(1-overall/100);
  const rows=[];
  for(let i=NT-1;i>=0;i--){ // 위가 고레벨, 아래가 저레벨 (올라가는 느낌)
    const done=(i<cur)||(pcts[i]>=CLEAR_PCT), isc=i===cur, locked=i>cur&&!done;
    const cls=isc?"cur":(done?"done":"");
    const badge=isc?`<span class="road-badge cur">진행중</span>`:(done?`<span class="road-badge done">완료</span>`:`<span class="road-badge lock">🔒</span>`);
    const node=done&&!isc?`<svg class="chk" viewBox="0 0 24 24" fill="none" stroke="#0e2414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`:`${i+1}`;
    const mini=isc?`<div class="mini"><i style="width:${curPct}%"></i></div><span class="mini-t">${counts[i]} / ${TIER_TOTAL(i)} 단어 · ${curPct}%</span>`:`<span>${done?`${counts[i]} / ${TIER_TOTAL(i)} 단어`:`${TIER_TOTAL(i)}단어`}</span>`;
    rows.push(`<div class="road-row ${cls}"><div class="rnode">${node}</div><div class="road-info ${isc?'curb':''}"><b>${esc(TIER_META[i].name)}</b>${mini}</div>${badge}</div>`);
  }
  const fillPct=NT>1?(cur/(NT-1))*100:0;
  return `
  <div class="level-hero">
    <div class="lv-ring"><svg width="64" height="64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--surface-2)" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--green)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${oc.toFixed(1)}" stroke-dashoffset="${ooff.toFixed(1)}" transform="rotate(-90 32 32)"/></svg><b>${overall}%</b></div>
    <div class="lv-txt"><b>${esc(TIER_META[cur].name)} <span style="color:var(--faint);font-weight:600;font-size:14px">· ${cur+1}/${NT}단계</span></b><span>전체 9단계 중 ${cur+1}단계 진행 중 · 총 ${totalMastered}/${NT*300}단어 완료</span><span style="display:block;margin-top:3px">◀ 이전: ${esc(prevName)} &nbsp;|&nbsp; 다음: ${esc(nextName)} ▶</span></div>
  </div>
  <div class="road"><div class="road-line"><i style="height:${fillPct}%"></i></div>${rows.join("")}</div>`;
}
function screenRecords(){
  setStep("");
  if(!auth.user){
    view.innerHTML=`<div class="card fade"><div class="eyebrow">내 기록</div><h2 class="title">로그인이 필요해요</h2><p class="lede">아이디로 로그인하면 시험 결과·정답률·복습 단어가 내 계정에 쌓여요.</p><div class="actions"><button class="btn primary" id="go">로그인 / 회원가입</button></div></div>`;
    $("#go").onclick=screenAuth; return;
  }
  const a=acc()||{sessions:[]};
  const sessions=(a.sessions||[]).slice().sort((x,y)=>y.ts-x.ts);
  const n=sessions.length;
  const avg=n?Math.round(sessions.reduce((s,x)=>s+(x.pct||0),0)/n):0;
  const wrongCount={},koOf={};
  sessions.forEach(s=>(s.wrong||[]).forEach(w=>{wrongCount[w.en]=(wrongCount[w.en]||0)+1;koOf[w.en]=w.ko;}));
  const correctEver=new Set(); sessions.forEach(s=>(s.right||[]).forEach(w=>correctEver.add(w.en)));
  const weak=Object.keys(wrongCount).map(en=>({en,ko:koOf[en],c:wrongCount[en]})).sort((p,q)=>q.c-p.c).slice(0,15);
  const nick=a.nickname||"";
  const weakRows=weak.length?weak.map(w=>`<div class="wrow"><span class="en">${esc(w.en)}</span><span class="ko">${esc(w.ko)}</span><span class="cnt">${w.c}회 틀림</span></div>`).join(""):`<p class="empty-note">아직 반복해서 틀린 단어가 없어요. 좋아요!</p>`;
  const histRows=n?sessions.slice(0,15).map(s=>`<div class="hrow"><span class="date">${fmtDate(s.ts)}</span><span class="lv">${esc((TIER_META[s.tier]||{}).name||'-')} · ${s.total}단어</span><span class="pct">${s.pct}%<small> (${s.correct}/${s.total})</small></span></div>`).join(""):`<p class="empty-note">아직 시험 기록이 없어요. 첫 학습을 시작해 보세요.</p>`;
  view.innerHTML=`
  <div class="card fade">
    <div class="study-head"><div><div class="eyebrow">내 기록</div><h2 class="title">${nick?esc(nick)+"님의 현황":esc(auth.user)+"님의 현황"}</h2></div><button class="btn ghost sm" id="logout">로그아웃</button></div>
    <p class="lede">아이디 <b>${esc(auth.user)}</b>로 로그인되어 있어요. ${isOnline()?'기록이 <b>온라인</b>에 저장돼 다른 기기에서 로그인해도 이어서 볼 수 있어요.':'지금은 이 기기(브라우저)에 저장돼요.'}</p>
    <h3 class="sect-h"><span class="d g"></span>내 레벨 여정</h3>
    ${roadmapHtml()}
    <div class="stat-row three" style="margin-top:20px"><div class="stat"><b>${n}</b><span>학습 세션</span></div><div class="stat ok"><b>${avg}<span style="font-size:15px">%</span></b><span>평균 정답률</span></div><div class="stat"><b>${correctEver.size}</b><span>맞힌 단어 수</span></div></div>
    <div class="nick"><input id="nickIn" maxlength="16" placeholder="표시할 닉네임 (선택)" value="${esc(nick)}"><button class="btn ghost sm" id="nickSave">저장</button></div>
    <div class="analysis"><h3><span class="d r"></span>복습이 필요한 단어 (${weak.length})</h3>${weakRows}${weak.length?`<div class="actions" style="margin-top:4px"><button class="btn primary sm" id="reviewWeak">이 단어들로 복습 시험</button></div>`:""}<h3 style="margin-top:28px"><span class="d g"></span>최근 학습 기록</h3>${histRows}</div>
    <div class="actions"><button class="btn primary" id="learn">단어암기 하러 가기</button><button class="btn ghost" id="home">메인으로</button></div>
    <div class="actions" style="margin-top:11px"><button class="btn danger sm" id="clear">기록 전체 삭제</button></div>
  </div>`;
  $("#logout").onclick=logout;
  $("#home").onclick=screenHome;
  $("#nickSave").onclick=async()=>{ const a2=acc()||{sessions:[]}; a2.nickname=($("#nickIn").value||"").trim().slice(0,16); auth.data=a2; const b=$("#nickSave"); b.disabled=true; b.textContent="저장 중…"; const ok=await saveCurrent(); renderAccountUI(); b.disabled=false; b.textContent=ok?"저장됨 ✓":"실패"; setTimeout(()=>{ if($("#nickSave"))$("#nickSave").textContent="저장"; },1400); };
  if(weak.length){ $("#reviewWeak").onclick=()=>{ const words=weak.map(w=>findEn(w.en)).filter(Boolean); if(!words.length) return; state.assigned=words; state.count=words.length; if(state.tier==null) state.tier=words[0].tier; screenStudy(); }; }
  $("#learn").onclick=screenStudyHub;
  const clr=$("#clear"); let armed=false;
  clr.onclick=async()=>{ if(!armed){ armed=true; clr.textContent="한 번 더 누르면 삭제돼요"; setTimeout(()=>{armed=false; if($("#clear"))$("#clear").textContent="기록 전체 삭제";},3000); return; } const a2=acc()||{}; a2.sessions=[]; auth.data=a2; await saveCurrent(); screenRecords(); };
}

// ---- theme ----
const sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){ if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); const dark=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches); $("#themeBtn").innerHTML=dark?sun:moon; }
let theme=null; try{ theme=localStorage.getItem("vocab-theme"); }catch(e){}
applyTheme(theme);
$("#themeBtn").onclick=()=>{ const cur=document.documentElement.getAttribute("data-theme"); const next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark")); theme=next; try{localStorage.setItem("vocab-theme",next);}catch(e){} applyTheme(next); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(!document.documentElement.getAttribute("data-theme")) applyTheme(null); });
$("#brand").onclick=()=>{ state.diagnosis=null; (auth.user||auth.guest)?screenHome():screenAuth(); };

// ---- boot ----
(async function boot(){
  setStep("");
  view.innerHTML=`<div class="card fade" style="text-align:center"><div class="eyebrow">단어 학습실</div><h2 class="title">불러오는 중…</h2><p class="lede" style="margin-left:auto;margin-right:auto">저장소에 연결하고 있어요.</p></div>`;
  await initCloud();
  try{ const u=localStorage.getItem(LS_SESSION); if(u){ const a=await getAccount(u); if(a){ auth.user=u; auth.data=a; } } }catch(e){}
  renderAccountUI();
  if(auth.user) screenHome(); else screenAuth();
})();
</script>
