<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>단어 학습실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --green:#4FE968;--green-deep:#2fb84c;--green-soft:#e6fbec;--green-ring:rgba(79,233,104,.35);
  --bg:#f5f7f5;--surface:#ffffff;--surface-2:#f1f4f1;--fg:#15241a;--muted:#5d6b61;--faint:#8a988d;
  --line:#e2e8e3;--danger:#e4572e;--danger-soft:#fcebe6;
  --radius:18px;--shadow:0 1px 2px rgba(20,36,26,.04), 0 10px 30px rgba(20,36,26,.06);
  --font:'Inter','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#4FE968;--green-deep:#6cf083;--green-soft:#17301d;--green-ring:rgba(79,233,104,.3);
    --bg:#0e140f;--surface:#161d18;--surface-2:#1d2620;--fg:#e8f0ea;--muted:#9db0a2;--faint:#6f7f74;
    --line:#2a352d;--danger:#ff7a58;--danger-soft:#3a201a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --green:#4FE968;--green-deep:#6cf083;--green-soft:#17301d;--green-ring:rgba(79,233,104,.3);
  --bg:#0e140f;--surface:#161d18;--surface-2:#1d2620;--fg:#e8f0ea;--muted:#9db0a2;--faint:#6f7f74;
  --line:#2a352d;--danger:#ff7a58;--danger-soft:#3a201a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:28px 64px;}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;cursor:pointer}
.logo{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;flex:none;box-shadow:0 4px 12px var(--green-ring)}
.logo svg{width:20px;height:20px}
.topbar .right{display:flex;gap:9px;align-items:center}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);height:38px;padding:0 13px;border-radius:11px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;transition:.15s}
.acct:hover{border-color:var(--faint)}
.adot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.adot.on{background:var(--green);box-shadow:0 0 0 3px var(--green-ring)}
.aname{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:38px;height:38px;border-radius:11px;cursor:pointer;display:grid;place-items:center;transition:.15s;flex:none}
.theme-btn:hover{color:var(--fg);border-color:var(--faint)}
.theme-btn svg{width:18px;height:18px}
.steps{display:flex;align-items:center;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--faint)}
.step .dot{width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;border:1px solid var(--line)}
.step.active{color:var(--fg)}
.step.active .dot{background:var(--green);color:#0e2414;border-color:var(--green)}
.step.done{color:var(--muted)}
.step.done .dot{background:var(--green-soft);color:var(--green-deep);border-color:transparent}
.step .bar{width:18px;height:2px;background:var(--line);border-radius:2px}
.steps.hide{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px}
.card + .card{margin-top:16px}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:11.5px;font-weight:700;color:var(--green-deep);margin-bottom:12px}
.lede{color:var(--muted);margin-top:10px;font-size:15px;max-width:52ch}
h1.hero{font-size:34px;font-weight:800;line-height:1.1}
h2.title{font-size:23px;font-weight:700}
.btn{appearance:none;border:none;border-radius:13px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;padding:14px 22px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn.primary{background:var(--green);color:#0e2414;box-shadow:0 6px 18px var(--green-ring)}
.btn.primary:hover{background:var(--green-deep);transform:translateY(-1px)}
.btn.primary:active{transform:translateY(0)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:10px 16px;font-size:13.5px;border-radius:11px}
.btn svg{width:18px;height:18px}
.actions{display:flex;gap:11px;margin-top:26px;flex-wrap:wrap}
.auth-tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:13px;margin-bottom:22px}
.auth-tabs button{flex:1;border:none;background:none;font-family:inherit;font-weight:700;font-size:14px;padding:11px;border-radius:9px;cursor:pointer;color:var(--muted);transition:.15s}
.auth-tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.inp{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.inp label{font-size:13px;font-weight:600;color:var(--muted)}
.inp input{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:13px 15px;font-size:15px;font-family:inherit}
.inp input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-ring)}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:18px;margin:2px 0 6px}
.link-row{display:flex;justify-content:center;margin-top:18px}
.link-btn{background:none;border:none;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--fg)}
.field{margin-top:26px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tier-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:13px;padding:14px 10px;cursor:pointer;font-family:inherit;text-align:center;transition:.12s;display:flex;flex-direction:column;gap:3px}
.tier-btn:hover{border-color:var(--green);background:var(--green-soft)}
.tier-btn.on{border-color:var(--green);background:var(--green-soft)}
.tier-btn b{font-size:14px;font-weight:700}
.tier-btn span{font-size:11px;color:var(--faint)}
.stepper{display:flex;align-items:center;gap:16px}
.stepper button{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:22px;font-weight:700;cursor:pointer;transition:.15s}
.stepper button:hover{background:var(--green-soft);border-color:var(--green)}
.count-val{font-size:40px;font-weight:800;min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.count-unit{color:var(--faint);font-size:13px;margin-top:2px;text-align:center}
input[type=range]{width:100%;margin-top:18px;accent-color:var(--green)}
.rng-scale{display:flex;justify-content:space-between;color:var(--faint);font-size:12px;margin-top:4px}
.qmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;color:var(--faint);font-size:13px;font-weight:600}
.pbar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:14px 0 26px}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s ease}
.prompt-word{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.prompt-sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.opts{display:grid;gap:11px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:16px 18px;font-size:16px;font-weight:500;font-family:inherit;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:13px}
.opt:hover{border-color:var(--green);background:var(--green-soft)}
.opt .key{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .key{background:var(--green);color:#0e2414}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.wrong .key{background:var(--danger);color:#fff}
.opt.disabled{pointer-events:none}
.opt.dim{opacity:.5}
.study-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--green-soft);color:var(--green-deep);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:99px}
.wordlist{display:grid;gap:10px;margin-top:22px}
.wordrow{display:flex;align-items:center;gap:16px;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.wordrow .idx{color:var(--faint);font-size:13px;font-weight:700;width:28px;flex:none;font-variant-numeric:tabular-nums}
.wordrow .en{font-size:18px;font-weight:700;min-width:0}
.wordrow .ko{margin-left:auto;color:var(--muted);font-size:15px;text-align:right}
.score-ring{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.ring{position:relative;width:168px;height:168px;margin-bottom:8px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring .num span{color:var(--faint);font-size:13px;font-weight:600;margin-top:4px}
.verdict{font-size:19px;font-weight:700;margin-top:6px}
.verdict small{display:block;color:var(--muted);font-weight:500;font-size:14px;margin-top:6px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.stat-row.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--surface-2);border-radius:14px;padding:16px 18px}
.stat b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-top:2px}
.stat.ok b{color:var(--green-deep)}
.stat.no b{color:var(--danger)}
.analysis h3{font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.analysis h3 .d{width:9px;height:9px;border-radius:50%}
.d.g{background:var(--green)} .d.r{background:var(--danger)}
.res-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:12px;background:var(--surface-2);margin-bottom:8px}
.res-row .en{font-weight:700;font-size:16px}
.res-row .ko{color:var(--muted);font-size:14px;margin-left:auto;text-align:right}
.res-row .picked{color:var(--danger);font-size:12.5px;display:block;margin-top:2px}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.mark svg{width:13px;height:13px}
.mark.g{background:var(--green)} .mark.r{background:var(--danger)}
.mark.g svg{stroke:#0e2414} .mark.r svg{stroke:#fff}
.empty-note{color:var(--faint);font-size:14px;padding:4px 2px}
.saved-tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--green-deep);margin-top:20px}
.saved-tag.muted{color:var(--muted)}
.saved-tag svg{width:16px;height:16px}
.wrow{display:flex;align-items:center;gap:13px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.wrow .en{font-weight:700;font-size:16px}
.wrow .ko{color:var(--muted);font-size:14px}
.wrow .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--danger);background:var(--danger-soft);padding:4px 10px;border-radius:99px;flex:none}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.hrow .date{font-size:13px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}
.hrow .lv{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:7px}
.hrow .pct{margin-left:auto;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.hrow .pct small{font-size:12px;color:var(--faint);font-weight:600}
.nick{display:flex;gap:10px;margin-top:14px}
.nick input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit}
.nick input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-ring)}
.hint{display:flex;gap:11px;align-items:flex-start;background:var(--green-soft);border-radius:13px;padding:14px 16px;margin-top:22px;font-size:13.5px;color:var(--fg)}
.hint.warn{background:var(--danger-soft)}
.hint svg{width:18px;height:18px;flex:none;margin-top:1px;stroke:var(--green-deep)}
.hint.warn svg{stroke:var(--danger)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:480px){.card{padding:22px}h1.hero{font-size:28px}.prompt-word{font-size:32px}.stat-row,.stat-row.three{grid-template-columns:1fr}.tier-grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.pbar i,.btn.primary{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand" id="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#0e2414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
      단어 학습실
    </div>
    <div class="right">
      <button class="acct" id="acct" aria-label="계정"><span class="adot"></span><span class="aname">로그인</span></button>
      <button class="theme-btn" id="themeBtn" title="테마 전환" aria-label="테마 전환"></button>
    </div>
  </div>
  <div class="steps" id="steps">
    <div class="step" data-s="level"><span class="dot">1</span>레벨 진단</div><span class="bar"></span>
    <div class="step" data-s="setup"><span class="dot">2</span>분량 설정</div><span class="bar"></span>
    <div class="step" data-s="study"><span class="dot">3</span>암기</div><span class="bar"></span>
    <div class="step" data-s="test"><span class="dot">4</span>시험</div><span class="bar"></span>
    <div class="step" data-s="result"><span class="dot">5</span>분석</div>
  </div>
  <div id="view"></div>
</div>
<script>

function distractors(word,n){
  const pool=shuffle(ALL.filter(w=>w.ko!==word.ko));
  const same=pool.filter(w=>w.tier===word.tier);
  const picks=[...same,...pool].filter((w,i,s)=>s.findIndex(x=>x.ko===w.ko)===i);
  const out=[],seen=new Set([word.ko]);
  for(const w of picks){ if(out.length>=n) break; if(!seen.has(w.ko)){seen.add(w.ko);out.push(w.ko);} }
  while(out.length<n) out.push("—");
  return out;
}

async function getAccount(u){
  if(cloud){
    try{
      const snap=await cloud.doc("accounts/"+u).get();
      if(snap){ if(snap.exists===false) return null; if(typeof snap.data==="function") return snap.data(); if(snap.data) return snap.data; }
      return null;
    }catch(e){ return null; }
  }
  const db=loadLS(); return db[u]||null;
}
async function putAccount(u,a){
  if(cloud){ try{ await cloud.doc("accounts/"+u).set(a); return true; }catch(e){ return false; } }
  const db=loadLS(); db[u]=a; return saveLS(db);
}

function randSalt(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
async function hashPw(pw,salt){
  const msg=salt+"::"+pw;
  try{ const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(let i=0;i<msg.length;i++){ h=((h<<5)+h+msg.charCodeAt(i))>>>0; } return "f"+h.toString(16); }
}

    <h2 class="title">${isLogin?'다시 오신 걸 환영해요':'학습 계정 만들기'}</h2>
    <p class="lede">${isLogin?'아이디와 비밀번호로 로그인하면 내 학습 기록을 이어서 볼 수 있어요.':'아이디와 비밀번호만 정하면 바로 시작할 수 있어요.'}</p>
    <form id="authForm" style="margin-top:22px" autocomplete="off">
      <div class="inp"><label for="uid">아이디</label><input id="uid" type="text" autocomplete="username" placeholder="3~16자 (영문·숫자·한글)" maxlength="16"></div>
      <div class="inp"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="${isLogin?'current-password':'new-password'}" placeholder="4자 이상" maxlength="32"></div>
      ${isLogin?'':`<div class="inp"><label for="pw2">비밀번호 확인</label><input id="pw2" type="password" autocomplete="new-password" placeholder="비밀번호를 한 번 더" maxlength="32"></div>`}
      <div class="err" id="err"></div>
      <button class="btn primary block" type="submit">${isLogin?'로그인':'가입하고 시작하기'}</button>
    </form>
    ${isLogin?'':`<div class="hint warn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span>이 로그인은 학습 기록 구분용 <b>간단한 저장용</b>이에요. 은행·이메일 등 <b>실제 비밀번호는 입력하지 마세요.</b></span></div>`}
    <div class="link-row"><button class="link-btn" id="guest">로그인 없이 둘러보기</button></div>
  </div>`;
  document.querySelectorAll(".auth-tabs button").forEach(b=>b.onclick=()=>{ authMode=b.dataset.m; screenAuth(); });
  $("#guest").onclick=()=>{ auth.user=null; renderAccountUI(); state.tier=null; screenLevelIntro(); };
  const err=m=>{ $("#err").textContent=m; };
  $("#authForm").onsubmit=async(e)=>{
    e.preventDefault();
    const u=($("#uid").value||"").trim(), pw=$("#pw").value||"";
    if(!/^[\w가-힣]{3,16}$/.test(u)){ err("아이디는 3~16자의 영문·숫자·한글이어야 해요."); return; }
    if(pw.length<4){ err("비밀번호는 4자 이상이어야 해요."); return; }
    if(!isLogin){ const pw2=$("#pw2").value||""; if(pw!==pw2){ err("비밀번호가 서로 달라요."); return; } }
    const submit=$("#authForm button[type=submit]"); submit.disabled=true; const label=submit.textContent; submit.textContent="처리 중…"; err("");
    const fail=m=>{ err(m); submit.disabled=false; submit.textContent=label; };
    if(isLogin){
      const a=await getAccount(u); if(!a){ fail("존재하지 않는 아이디예요."); return; }
      const h=await hashPw(pw,a.salt); if(h!==a.pw){ fail("비밀번호가 올바르지 않아요."); return; }
      auth.user=u; auth.data=a;
    }else{
      const exists=await getAccount(u); if(exists){ fail("이미 사용 중인 아이디예요."); return; }
      const salt=randSalt(), h=await hashPw(pw,salt); const a={ pw:h, salt, nickname:"", sessions:[], createdAt:Date.now() };
      const ok=await putAccount(u,a); if(!ok){ fail("저장소에 연결할 수 없어요. 잠시 후 다시 시도해 주세요."); return; }
      auth.user=u; auth.data=a;
    }
    try{ localStorage.setItem(LS_SESSION, u); }catch(e){}
    renderAccountUI(); state.tier=null; state.diagnosis=null; screenLevelIntro();
  };
  setTimeout(()=>{ const el=$("#uid"); if(el) el.focus(); },50);
}

// ---- 1. Diagnosis (9 tiers) ----
let diag=null;
function screenLevelIntro(){
  setStep("level");
  const hello = auth.user ? `<p class="lede">${esc((acc()&&acc().nickname)||auth.user)}님, 오늘도 시작해 볼까요? 짧은 진단으로 딱 맞는 단계를 찾아 드려요.</p>` :
    `<p class="lede">짧은 진단 퀴즈(9문제)로 지금 실력을 가늠해 볼게요. 초등 기초부터 최상급까지 9단계 중 나에게 맞는 단계를 골라 드려요.</p>`;
  view.innerHTML=`
  <div class="card fade">
    <div class="eyebrow">STEP 1 · 레벨 진단</div>
    <h1 class="hero">나에게 맞는 단계부터<br>시작해요</h1>
    ${hello}
    <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>모르는 단어는 과감히 찍어도 괜찮아요. 모르는 만큼이 바로 배울 거리예요.</span></div>
    <div class="actions">
      <button class="btn primary" id="go">진단 시작하기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      ${auth.user?`<button class="btn ghost" id="rec">내 기록 보기</button>`:`<button class="btn ghost" id="login">로그인</button>`}
      <button class="btn ghost" id="pick">단계 직접 고르기</button>
    </div>
  </div>`;
  $("#go").onclick=startDiag;
  if(auth.user) $("#rec").onclick=screenRecords; else $("#login").onclick=screenAuth;
  $("#pick").onclick=()=>{ state.tier=state.tier==null?0:state.tier; screenSetup(); };
}
function startDiag(){
  const qs=[]; for(let i=0;i<NT;i++){ const pool=byTier(i); qs.push(pool[Math.floor(Math.random()*pool.length)]); }
  diag={qs, i:0, correct:new Array(NT).fill(false)};
  renderDiagQ();
}
function renderDiagQ(){
  setStep("level");
  const w=diag.qs[diag.i], opts=shuffle([w.ko,...distractors(w,3)]), total=diag.qs.length;
  view.innerHTML=`
  <div class="card fade">
    <div class="qmeta"><span>레벨 진단</span><span>${diag.i+1} / ${total}</span></div>
    <div class="pbar"><i style="width:${(diag.i/total)*100}%"></i></div>
    <p class="prompt-sub">다음 단어의 뜻으로 알맞은 것은?</p>
    <div class="prompt-word">${esc(w.en)}</div>
    <div class="opts" id="opts"></div>
  </div>`;
  const box=$("#opts");
  opts.forEach((o,i)=>{ const b=document.createElement("button"); b.className="opt"; b.innerHTML=`<span class="key">${KEYS[i]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{ if(o===w.ko) diag.correct[w.tier]=true; diag.i++; (diag.i>=total)?finishDiag():renderDiagQ(); }; box.appendChild(b); });
}
function finishDiag(){
  let rec=0, cnt=0; for(let i=0;i<NT;i++){ if(diag.correct[i]){ rec=i; cnt++; } }
  state.tier=rec; state.diagnosis={cnt}; screenLevelResult();
}
function screenLevelResult(){
  setStep("level");
  const ti=state.tier, c=state.diagnosis;
  view.innerHTML=`
  <div class="card fade">
    <div class="eyebrow">진단 완료</div>
    <h2 class="title">추천 단계는 <span style="color:var(--green-deep)">${esc(TIER_META[ti].name)}</span></h2>
    <p class="lede">${TIER_DESC[ti]}</p>
    <div class="stat-row">
      <div class="stat ok"><b>${c.cnt}<span style="font-size:15px;color:var(--faint)"> / 9</span></b><span>진단 정답</span></div>
      <div class="stat"><b>${esc(TIER_META[ti].name)}</b><span>추천 단계</span></div>
    </div>
    <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>단계는 다음 화면에서 직접 바꿀 수 있어요.</span></div>
    <div class="actions"><button class="btn primary" id="next">분량 설정하기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
  </div>`;
  $("#next").onclick=screenSetup;
}

// ---- 2. Setup ----
function screenSetup(){
  setStep("setup");
  if(state.tier==null) state.tier=0;
  const maxForTier=Math.min(MAX_WORDS, byTier(state.tier).length);
  if(state.count>maxForTier) state.count=maxForTier;
  if(state.count<MIN_WORDS) state.count=MIN_WORDS;
  view.innerHTML=`
  <div class="card fade">
    <div class="eyebrow">STEP 2 · 분량 설정</div>
    <h2 class="title">단계와 분량을 정해요</h2>
    <p class="lede">각 단계마다 300단어가 준비돼 있어요. 한 번에 외울 양만 고르면, 그 단계에서 무작위로 뽑아 드려요. (한 번에 최대 ${MAX_WORDS}개)</p>
    <div class="field"><label>학습 단계</label><div class="tier-grid" id="tiers"></div></div>
    <div class="field">
      <label>단어 개수 <span style="color:var(--faint);font-weight:500">· 권장 ${DEFAULT_WORDS}개</span></label>
      <div class="stepper"><button id="minus" aria-label="줄이기">−</button><div><div class="count-val" id="countVal">${state.count}</div><div class="count-unit">단어</div></div><button id="plus" aria-label="늘리기">+</button></div>
      <input type="range" id="rng" min="${MIN_WORDS}" max="${maxForTier}" value="${state.count}">
      <div class="rng-scale"><span>${MIN_WORDS}</span><span>${maxForTier}</span></div>
    </div>
    <div class="actions"><button class="btn ghost" id="back">레벨 다시 진단</button><button class="btn primary" id="start">암기 시작하기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
  </div>`;
  const tg=$("#tiers");
  TIER_META.forEach((m,i)=>{ const b=document.createElement("button"); b.className="tier-btn"+(i===state.tier?" on":""); b.innerHTML=`<b>${esc(m.name)}</b><span>Lv.${i+1}</span>`; b.onclick=()=>{ state.tier=i; screenSetup(); }; tg.appendChild(b); });
  const cv=$("#countVal"),rng=$("#rng");
  const sync=v=>{ v=Math.max(MIN_WORDS,Math.min(maxForTier,v)); state.count=v; cv.textContent=v; rng.value=v; };
  $("#minus").onclick=()=>sync(state.count-1); $("#plus").onclick=()=>sync(state.count+1); rng.oninput=()=>sync(+rng.value);
  $("#back").onclick=screenLevelIntro;
  $("#start").onclick=()=>{ state.assigned=sample(byTier(state.tier),state.count); screenStudy(); };
}

// ---- 3. Study ----
function screenStudy(){
  setStep("study");
  const rows=state.assigned.map((w,i)=>`<div class="wordrow"><span class="idx">${String(i+1).padStart(2,'0')}</span><span class="en">${esc(w.en)}</span><span class="ko">${esc(w.ko)}</span></div>`).join("");
  view.innerHTML=`
  <div class="card fade">
    <div class="study-head"><div><div class="eyebrow">STEP 3 · 암기</div><h2 class="title">먼저 눈에 익혀요</h2></div><span class="chip">${esc(TIER_META[state.tier].name)} · ${state.assigned.length}단어</span></div>
    <p class="lede">아래 단어와 뜻을 천천히 읽어 보세요. 준비되면 시험으로 넘어갑니다. 시험에서는 뜻이 숨겨져요.</p>
    <div class="wordlist">${rows}</div>
    <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><span>소리 내어 읽으면 더 잘 외워져요. 전부 외울 필요는 없어요 — 시험이 약점을 짚어 줄 거예요.</span></div>
    <div class="actions"><button class="btn ghost" id="re">단어 다시 뽑기</button><button class="btn primary" id="toTest">시험 보러 가기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
  </div>`;
  $("#re").onclick=()=>{ state.assigned=sample(byTier(state.tier),state.count); screenStudy(); };
  $("#toTest").onclick=startTest;
}

// ---- 4. Test ----
function startTest(){ state.test=shuffle(state.assigned).map(w=>({word:w,options:shuffle([w.ko,...distractors(w,3)])})); state.answers=[]; state.qIndex=0; renderTestQ(); }
function renderTestQ(){
  setStep("test");
  const i=state.qIndex,total=state.test.length,item=state.test[i],w=item.word;
  view.innerHTML=`
  <div class="card fade">
    <div class="qmeta"><span>시험</span><span>${i+1} / ${total}</span></div>
    <div class="pbar"><i style="width:${(i/total)*100}%"></i></div>
    <p class="prompt-sub">이 단어의 뜻은 무엇일까요?</p>
    <div class="prompt-word">${esc(w.en)}</div>
    <div class="opts" id="opts"></div>
  </div>`;
  const box=$("#opts");
  item.options.forEach((o,k)=>{ const b=document.createElement("button"); b.className="opt"; b.innerHTML=`<span class="key">${KEYS[k]}</span><span>${esc(o)}</span>`; b.onclick=()=>pick(b,o); box.appendChild(b); });
  function pick(btn,chosen){
    const correct=chosen===w.ko; state.answers.push({word:w,chosen,correct});
    box.querySelectorAll(".opt").forEach(el=>{ el.classList.add("disabled"); const label=el.querySelector("span:last-child").textContent; if(label===w.ko) el.classList.add("correct"); else if(el===btn) el.classList.add("wrong"); else el.classList.add("dim"); });
    setTimeout(()=>{ state.qIndex++; (state.qIndex>=total)?screenResult():renderTestQ(); }, correct?560:1000);
  }
}

// ---- 5. Result ----
function screenResult(){
  setStep("result");
  const ans=state.answers,total=ans.length;
  const correct=ans.filter(a=>a.correct),wrong=ans.filter(a=>!a.correct);
  const pct=total?Math.round((correct.length/total)*100):0;
  let verdict,note;
  if(pct===100){verdict="완벽해요! 🎉";note="이 단어들은 완전히 내 것이 됐어요.";}
  else if(pct>=80){verdict="아주 좋아요";note="거의 다 외웠어요. 틀린 몇 개만 다시 보면 끝!";}
  else if(pct>=60){verdict="잘하고 있어요";note="절반 이상 맞혔어요. 틀린 단어를 복습해 볼까요?";}
  else if(pct>=40){verdict="조금 더 힘내요";note="아직 낯선 단어가 많네요. 암기부터 다시 다져요.";}
  else {verdict="처음이 어렵죠";note="천천히 다시 외워 보면 금방 익숙해질 거예요.";}
  let savedLine="";
  if(auth.user){
    const a=acc()||{sessions:[]};
    a.sessions=(a.sessions||[]).concat([{ ts:Date.now(),tier:state.tier,total,correct:correct.length,pct, wrong:wrong.map(x=>({en:x.word.en,ko:x.word.ko})), right:correct.map(x=>({en:x.word.en,ko:x.word.ko})) }]).slice(-120);
    auth.data=a;
    saveCurrent().then(ok=>{ const t=$("#saveLine"); if(!t) return; t.className="saved-tag"+(ok?"":" muted"); t.innerHTML = ok?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> ${esc(auth.user)} 계정에 저장했어요${isOnline()?' (온라인)':''}`:`저장에 실패했어요. 잠시 후 다시 시도해 주세요.`; });
    savedLine=`<div class="saved-tag muted" id="saveLine">저장 중…</div>`;
  }else{ savedLine=`<div class="saved-tag muted" id="saveLine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> 로그인하면 이 결과가 저장돼요</div>`; }
  const C=2*Math.PI*74,off=C*(1-pct/100);
  const okRows=correct.map(a=>`<div class="res-row"><span class="mark g"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span class="en">${esc(a.word.en)}</span><span class="ko">${esc(a.word.ko)}</span></div>`).join("")||`<p class="empty-note">맞힌 단어가 아직 없어요.</p>`;
  const noRows=wrong.map(a=>`<div class="res-row"><span class="mark r"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span><span class="en">${esc(a.word.en)}</span><span class="ko">${esc(a.word.ko)}<span class="picked">내 선택: ${esc(a.chosen)}</span></span></div>`).join("")||`<p class="empty-note">틀린 단어가 없어요. 훌륭해요!</p>`;
  view.innerHTML=`
  <div class="card fade">
    <div class="eyebrow">STEP 5 · 결과 분석</div>
    <div class="score-ring">
      <div class="ring"><svg width="168" height="168"><circle cx="84" cy="84" r="74" fill="none" stroke="var(--surface-2)" stroke-width="13"/><circle cx="84" cy="84" r="74" fill="none" stroke="var(--green)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="num"><b>${pct}<span style="font-size:20px">%</span></b><span>${correct.length} / ${total} 정답</span></div></div>
      <div class="verdict">${verdict}<small>${note}</small></div>
      ${savedLine}
    </div>
    <div class="stat-row"><div class="stat ok"><b>${correct.length}</b><span>맞힌 단어</span></div><div class="stat no"><b>${wrong.length}</b><span>틀린 단어</span></div></div>
    <div class="analysis"><h3><span class="d r"></span>다시 볼 단어 (${wrong.length})</h3>${noRows}<h3><span class="d g"></span>맞힌 단어 (${correct.length})</h3>${okRows}</div>
    <div class="actions">${wrong.length?`<button class="btn primary" id="retry">틀린 단어만 다시 시험</button>`:""}<button class="btn ${wrong.length?'ghost':'primary'}" id="again">새 단어로 다시 하기</button></div>
    <div class="actions" style="margin-top:11px">${auth.user?`<button class="btn ghost" id="rec2">내 기록 보기</button>`:""}<button class="btn ghost" id="home">처음부터</button></div>
  </div>`;
  if(wrong.length){ $("#retry").onclick=()=>{ state.assigned=wrong.map(a=>a.word); state.count=state.assigned.length; screenStudy(); }; }
  $("#again").onclick=screenSetup;
  if(auth.user) $("#rec2").onclick=screenRecords;
  $("#home").onclick=()=>{ state.tier=null; state.diagnosis=null; screenLevelIntro(); };
}

// ---- 내 기록 ----
function screenRecords(){
  setStep("");
  if(!auth.user){
    view.innerHTML=`<div class="card fade"><div class="eyebrow">내 기록</div><h2 class="title">로그인이 필요해요</h2><p class="lede">아이디로 로그인하면 시험 결과·정답률·복습 단어가 내 계정에 쌓여요.</p><div class="actions"><button class="btn primary" id="go">로그인 / 회원가입</button></div></div>`;
    $("#go").onclick=screenAuth; return;
  }
  const a=acc()||{sessions:[]};
  const sessions=(a.sessions||[]).slice().sort((x,y)=>y.ts-x.ts);
  const n=sessions.length;
  const avg=n?Math.round(sessions.reduce((s,x)=>s+(x.pct||0),0)/n):0;
  const wrongCount={},koOf={};
  sessions.forEach(s=>(s.wrong||[]).forEach(w=>{wrongCount[w.en]=(wrongCount[w.en]||0)+1;koOf[w.en]=w.ko;}));
  const correctEver=new Set(); sessions.forEach(s=>(s.right||[]).forEach(w=>correctEver.add(w.en)));
  const weak=Object.keys(wrongCount).map(en=>({en,ko:koOf[en],c:wrongCount[en]})).sort((p,q)=>q.c-p.c).slice(0,15);
  const nick=a.nickname||"";
  const weakRows=weak.length?weak.map(w=>`<div class="wrow"><span class="en">${esc(w.en)}</span><span class="ko">${esc(w.ko)}</span><span class="cnt">${w.c}회 틀림</span></div>`).join(""):`<p class="empty-note">아직 반복해서 틀린 단어가 없어요. 좋아요!</p>`;
  const histRows=n?sessions.slice(0,15).map(s=>`<div class="hrow"><span class="date">${fmtDate(s.ts)}</span><span class="lv">${esc((TIER_META[s.tier]||{}).name||'-')} · ${s.total}단어</span><span class="pct">${s.pct}%<small> (${s.correct}/${s.total})</small></span></div>`).join(""):`<p class="empty-note">아직 시험 기록이 없어요. 첫 학습을 시작해 보세요.</p>`;
  view.innerHTML=`
  <div class="card fade">
    <div class="study-head"><div><div class="eyebrow">내 기록</div><h2 class="title">${nick?esc(nick)+"님의 현황":esc(auth.user)+"님의 현황"}</h2></div><button class="btn ghost sm" id="logout">로그아웃</button></div>
    <p class="lede">아이디 <b>${esc(auth.user)}</b>로 로그인되어 있어요. ${isOnline()?'기록이 <b>온라인</b>에 저장돼 다른 기기에서 로그인해도 이어서 볼 수 있어요.':'지금은 이 기기(브라우저)에 저장돼요.'}</p>
    <div class="stat-row three"><div class="stat"><b>${n}</b><span>학습 세션</span></div><div class="stat ok"><b>${avg}<span style="font-size:15px">%</span></b><span>평균 정답률</span></div><div class="stat"><b>${correctEver.size}</b><span>맞힌 단어 수</span></div></div>
    <div class="nick"><input id="nickIn" maxlength="16" placeholder="표시할 닉네임 (선택)" value="${esc(nick)}"><button class="btn ghost sm" id="nickSave">저장</button></div>
    <div class="analysis"><h3><span class="d r"></span>복습이 필요한 단어 (${weak.length})</h3>${weakRows}${weak.length?`<div class="actions" style="margin-top:4px"><button class="btn primary sm" id="reviewWeak">이 단어들로 복습 시험</button></div>`:""}<h3 style="margin-top:28px"><span class="d g"></span>최근 학습 기록</h3>${histRows}</div>
    <div class="actions"><button class="btn primary" id="learn">새 학습 시작하기</button></div>
    <div class="actions" style="margin-top:11px"><button class="btn danger sm" id="clear">기록 전체 삭제</button></div>
  </div>`;
  $("#logout").onclick=logout;
  $("#nickSave").onclick=async()=>{ const a2=acc()||{sessions:[]}; a2.nickname=($("#nickIn").value||"").trim().slice(0,16); auth.data=a2; const b=$("#nickSave"); b.disabled=true; b.textContent="저장 중…"; const ok=await saveCurrent(); renderAccountUI(); b.disabled=false; b.textContent=ok?"저장됨 ✓":"실패"; setTimeout(()=>{ if($("#nickSave"))$("#nickSave").textContent="저장"; },1400); };
  if(weak.length){ $("#reviewWeak").onclick=()=>{ const words=weak.map(w=>findEn(w.en)).filter(Boolean); if(!words.length) return; state.assigned=words; state.count=words.length; if(state.tier==null) state.tier=words[0].tier; screenStudy(); }; }
  $("#learn").onclick=()=>{ state.tier=null; state.diagnosis=null; screenLevelIntro(); };
  const clr=$("#clear"); let armed=false;
  clr.onclick=async()=>{ if(!armed){ armed=true; clr.textContent="한 번 더 누르면 삭제돼요"; setTimeout(()=>{armed=false; if($("#clear"))$("#clear").textContent="기록 전체 삭제";},3000); return; } const a2=acc()||{}; a2.sessions=[]; auth.data=a2; await saveCurrent(); screenRecords(); };
}

// ---- theme ----
const sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){ if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); const dark=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches); $("#themeBtn").innerHTML=dark?sun:moon; }
let theme=null; try{ theme=localStorage.getItem("vocab-theme"); }catch(e){}
applyTheme(theme);
$("#themeBtn").onclick=()=>{ const cur=document.documentElement.getAttribute("data-theme"); const next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark")); theme=next; try{localStorage.setItem("vocab-theme",next);}catch(e){} applyTheme(next); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(!document.documentElement.getAttribute("data-theme")) applyTheme(null); });
$("#brand").onclick=()=>{ state.tier=null; state.diagnosis=null; auth.user?screenLevelIntro():screenAuth(); };

// ---- boot ----
(async function boot(){
  setStep("");
  view.innerHTML=`<div class="card fade" style="text-align:center"><div class="eyebrow">단어 학습실</div><h2 class="title">불러오는 중…</h2><p class="lede" style="margin-left:auto;margin-right:auto">저장소에 연결하고 있어요.</p></div>`;
  await initCloud();
  try{ const u=localStorage.getItem(LS_SESSION); if(u){ const a=await getAccount(u); if(a){ auth.user=u; auth.data=a; } } }catch(e){}
  renderAccountUI();
  if(auth.user) screenLevelIntro(); else screenAuth();
})();
</script>
</body>
</html>
